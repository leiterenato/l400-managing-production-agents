[project]
name = "financial-support-agent"
version = "0.1.0"
description = "L400 reference agent — Managing Production Agents at Scale (Case 1: Continuous Evaluation & EDD)."
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3.26",
    "google-adk[a2a]>=2.3.0",
    "google-cloud-aiplatform[evaluation]>=1.159.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
